<!DOCTYPE html>
<html lang="en">

<head>
  <title>NYC Weather x Skincare Advisor</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Live NYC weather and air quality tracker with smart skincare product recommendations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>

<body>
  <div class="bg-shape shape-1" aria-hidden="true"></div>
  <div class="bg-shape shape-2" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">LIVE CITY SKIN REPORT</p>
      <h1>NYC Weather x Skincare Advisor</h1>
      <p class="subtitle">
        Real-time weather and pollution data from New York City, translated into simple product choices for healthier skin.
      </p>
      <div class="hero-meta">
        <p id="last-updated">Loading latest conditions...</p>
        <button id="refresh-btn" type="button">Refresh Data</button>
      </div>
    </header>

    <section class="panel" aria-labelledby="conditions-title">
      <div class="panel-head">
        <h2 id="conditions-title">Current Conditions</h2>
        <span class="city-pill">New York City, NY</span>
      </div>
      <div id="metrics-grid" class="metrics-grid" aria-live="polite"></div>
    </section>

    <section class="panel" aria-labelledby="recommend-title">
      <div class="panel-head">
        <h2 id="recommend-title">Skincare Product Recommendations</h2>
      </div>
      <div id="summary-banner" class="summary-banner" aria-live="polite"></div>
      <div id="recommendations" class="recommendations" aria-live="polite"></div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <script src="script.js" defer></script>
</body>

</html>
